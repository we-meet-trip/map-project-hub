name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: "검사할 branch/tag/SHA. 비우면 실행 workflow의 ref"
        type: string
        default: ""
      build_image:
        description: "Docker 런타임 빌드 검사 (레지스트리 게시 없음)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HUB_DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1/ci
      KMA_SERVICE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip check
      - name: import runtime
        run: python -c "import map_project_hub.main"
      - name: test
        run: python -m pytest -q
      - name: build runtime image
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_image }}
        run: docker build --tag map-runtime:ci .

  database-isolation:
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --cpus=1 --memory=1g --pids-limit=128
          --tmpfs /var/lib/postgresql/data:rw,size=536870912
          --log-opt max-size=10m --log-opt max-file=3
          --health-cmd "pg_isready -U fixture -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install hub dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
          mkdir -p receipt
          python -m pip freeze > receipt/python-freeze.txt
          command -v psql
      - name: Record exact service image and source
        env:
          PG_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker inspect --format '{{.Image}}' "$PG_SERVICE_ID" > receipt/postgres-image-id.txt
          image_id="$(cat receipt/postgres-image-id.txt)"
          docker image inspect --format '{{json .RepoDigests}}' "$image_id" > receipt/postgres-repodigests.json
          git rev-parse HEAD > receipt/hub-source.txt
          sha256sum scripts/verify-postgres-contract.py scripts/database-roles.sql > receipt/harness-sha256.txt
      - name: Run real migrations and runtime permission contract
        env:
          PGPASSWORD: ci-disposable-only
          HUB_CONTRACT_FIXTURE_DSN: host=127.0.0.1 port=55432 dbname=contract_hub user=fixture password=ci-disposable-only
        run: |
          # The PostGIS image seeds its default DB. template0 gives this check a truly empty DB.
          psql -X -h 127.0.0.1 -p 55432 -U fixture -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE contract_hub TEMPLATE template0'
          timeout 900 python scripts/verify-postgres-contract.py --output receipt/result.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: database-isolation-${{ github.sha }}
          path: receipt/
          retention-days: 7
