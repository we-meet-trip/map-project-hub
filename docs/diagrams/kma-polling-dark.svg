<svg xmlns="http://www.w3.org/2000/svg" width="1290" height="814" viewBox="0 0 1290 814" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="13" fill="#E6EDF3" role="img" aria-label="기상청 예보 수집과 조회"><title>기상청 예보 수집과 조회</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8B949E"/></marker></defs><rect width="100%" height="100%" fill="#0D1117"/><line x1="185.0" y1="64" x2="185.0" y2="804" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="84.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="185.0" y="34" text-anchor="middle" font-weight="700">스케줄러</text><text x="185.0" y="52" text-anchor="middle" font-size="11">APScheduler</text><line x1="415.0" y1="64" x2="415.0" y2="804" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="314.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="415.0" y="34" text-anchor="middle" font-weight="700">hub 수집 잡</text><text x="415.0" y="52" text-anchor="middle" font-size="11">hub_scheduler</text><line x1="645.0" y1="64" x2="645.0" y2="804" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="544.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="645.0" y="34" text-anchor="middle" font-weight="700">기상청 API</text><text x="645.0" y="52" text-anchor="middle" font-size="11">공공데이터포털</text><line x1="875.0" y1="64" x2="875.0" y2="804" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="774.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="875.0" y="34" text-anchor="middle" font-weight="700">PostGIS</text><text x="875.0" y="52" text-anchor="middle" font-size="11">hub_data</text><line x1="1105.0" y1="64" x2="1105.0" y2="804" stroke="#6E7681" stroke-dasharray="3 5"/><rect x="1004.0" y="12" width="202" height="46" rx="6" fill="#0C2D6B" stroke="#58A6FF"/><text x="1105.0" y="34" text-anchor="middle" font-weight="700">호출 서비스</text><text x="1105.0" y="52" text-anchor="middle" font-size="11">user·agent</text><rect x="35.0" y="104" width="1220" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="122" font-weight="600">수집 (단기 02·05·…·23시 10분, 중기 06·18시 10분)</text><text x="300.0" y="156" text-anchor="middle">short_term_polling_loop()</text><line x1="185.0" y1="162" x2="415.0" y2="162" stroke="#8B949E" marker-end="url(#arr)"/><path d="M415.0,184 h28 v22 h-28" fill="none" stroke="#8B949E" marker-end="url(#arr)"/><text x="451.0" y="198">스텁 모드면 건너뜀, 키가 비면 한 번 알리고 건너뜀</text><text x="645.0" y="240" text-anchor="middle">활성 구독 격자·이미 적재한 격자 조회</text><line x1="415.0" y1="246" x2="875.0" y2="246" stroke="#8B949E" marker-end="url(#arr)"/><text x="645.0" y="280" text-anchor="middle">남은 격자 목록</text><line x1="875.0" y1="286" x2="415.0" y2="286" stroke="#8B949E" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="530.0" y="320" text-anchor="middle">격자마다 단기예보 요청(페이지</text><text x="530.0" y="338" text-anchor="middle">단위)</text><line x1="415.0" y1="344" x2="645.0" y2="344" stroke="#8B949E" marker-end="url(#arr)"/><text x="530.0" y="378" text-anchor="middle">items + totalCount</text><line x1="645.0" y1="384" x2="415.0" y2="384" stroke="#8B949E" stroke-dasharray="6 4" marker-end="url(#arr)"/><path d="M415.0,406 h28 v36 h-28" fill="none" stroke="#8B949E" marker-end="url(#arr)"/><text x="451.0" y="420">페이지마다 totalCount 일치·행 누락/중복 검사 —</text><text x="451.0" y="438">어긋나면 그 발표분을 버림</text><text x="645.0" y="476" text-anchor="middle">upsert_short_term_items</text><line x1="415.0" y1="482" x2="875.0" y2="482" stroke="#8B949E" marker-end="url(#arr)"/><path d="M415.0,504 h28 v22 h-28" fill="none" stroke="#8B949E" marker-end="url(#arr)"/><text x="451.0" y="518">실패한 격자는 마감 전까지 다음 라운드에서 다시</text><rect x="35.0" y="548" width="1220" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="566" font-weight="600">감시 (매시 25분: 단기 남은 격자, 매시 20분: 중기 발표분 확인)</text><text x="300.0" y="600" text-anchor="middle">빠진 격자·발표분만 다시 수집</text><line x1="185.0" y1="606" x2="415.0" y2="606" stroke="#8B949E" marker-end="url(#arr)"/><rect x="35.0" y="628" width="1220" height="26" rx="4" fill="#161B22" stroke="#30363D"/><text x="45.0" y="646" font-weight="600">조회 (요청 시점에는 발급처를 부르지 않는다)</text><text x="990.0" y="680" text-anchor="middle">GET /v1/weather → 같은 광역의</text><text x="990.0" y="698" text-anchor="middle">가장 가까운 활성 격자로 적재본</text><text x="990.0" y="716" text-anchor="middle">읽기</text><line x1="1105.0" y1="722" x2="875.0" y2="722" stroke="#8B949E" marker-end="url(#arr)"/><text x="990.0" y="756" text-anchor="middle">일별 예보 + 빈 날 표시</text><line x1="875.0" y1="762" x2="1105.0" y2="762" stroke="#8B949E" stroke-dasharray="6 4" marker-end="url(#arr)"/></svg>
